spring:
  application:
    name: mowoo-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/mowoo}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        type:
          # UUID 타입 ID를 binary(16) 대신 ERD와 같은 36자 문자열로 저장
          preferred_uuid_jdbc_type: CHAR
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:10MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:30MB}

jwt:
  secret: ${JWT_SECRET}
  access-exp-ms: ${JWT_EXPIRATION:3600000}
  refresh-exp-ms: ${JWT_REFRESH_EXPIRATION:1209600000}

kakao:
  client-id: ${KAKAO_CLIENT_ID}
  client-secret: ${KAKAO_CLIENT_SECRET}
  redirect-uri: ${KAKAO_REDIRECT_URI}
  token-uri: https://kauth.kakao.com/oauth/token
  user-info-uri: https://kapi.kakao.com/v2/user/me

auth:
  cookie:
    secure: ${AUTH_COOKIE_SECURE:true}

app:
  dotenv:
    directory: ${DOTENV_DIRECTORY:.}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}

cloud:
  aws:
    region: ${AWS_REGION}
    credentials:
      access-key: ${AWS_ACCESS_KEY_ID}
      secret-key: ${AWS_SECRET_ACCESS_KEY}
    s3:
      enabled: ${AWS_S3_ENABLED:false}
      bucket: ${AWS_S3_BUCKET}
      path:
        location: ${AWS_S3_LOCATION:uploads}

# Shared settings contain references only; actual credentials stay in the local .env.
upstage:
  api-key: ${UPSTAGE_API_KEY:}
  model: ${UPSTAGE_MODEL:solar-pro4}
  base-url: ${UPSTAGE_BASE_URL:https://api.upstage.ai/v1}
  enabled: ${UPSTAGE_ENABLED:false}
  connect-timeout-ms: ${UPSTAGE_CONNECT_TIMEOUT_MS:3000}
  read-timeout-ms: ${UPSTAGE_READ_TIMEOUT_MS:30000}
  max-output-tokens: ${UPSTAGE_MAX_OUTPUT_TOKENS:2048}

mowoo:
  emotion:
    seed:
      enabled: ${MOWOO_EMOTION_SEED_ENABLED:false}
