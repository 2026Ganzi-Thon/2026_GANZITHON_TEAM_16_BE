AWSTemplateFormatVersion: '2010-09-09'
Description: Mowoo VPC, single-instance application security group and private MySQL
Parameters:
  Project:
    Type: String
    Default: mowoo
    AllowedPattern: '[a-z][a-z0-9-]{2,20}'
  AvailabilityZones:
    Type: List<AWS::EC2::AvailabilityZone::Name>
    Description: Two availability zones in the deployment region
  DatabaseInstanceClass:
    Type: String
    Default: db.t4g.micro
Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{Key: Name, Value: !Sub '${Project}-vpc'}]
  InternetGateway:
    Type: AWS::EC2::InternetGateway
  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway
  PublicA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !Ref AvailabilityZones]
      CidrBlock: 10.42.1.0/24
      MapPublicIpOnLaunch: true
      Tags: [{Key: Name, Value: !Sub '${Project}-public-a'}]
  PublicB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !Ref AvailabilityZones]
      CidrBlock: 10.42.2.0/24
      MapPublicIpOnLaunch: true
      Tags: [{Key: Name, Value: !Sub '${Project}-public-b'}]
  PrivateDbA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !Ref AvailabilityZones]
      CidrBlock: 10.42.11.0/24
      MapPublicIpOnLaunch: false
      Tags: [{Key: Name, Value: !Sub '${Project}-db-a'}]
  PrivateDbB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !Ref AvailabilityZones]
      CidrBlock: 10.42.12.0/24
      MapPublicIpOnLaunch: false
      Tags: [{Key: Name, Value: !Sub '${Project}-db-b'}]
  PublicRoutes:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRoutes
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
  PublicAssociationA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref PublicA, RouteTableId: !Ref PublicRoutes}
  PublicAssociationB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref PublicB, RouteTableId: !Ref PublicRoutes}
  PrivateRoutes:
    Type: AWS::EC2::RouteTable
    Properties: {VpcId: !Ref Vpc}
  PrivateAssociationA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref PrivateDbA, RouteTableId: !Ref PrivateRoutes}
  PrivateAssociationB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref PrivateDbB, RouteTableId: !Ref PrivateRoutes}
  ApplicationSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public nginx HTTP and HTTPS; no public SSH or Java port
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0}
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0}
  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Only application instances can connect to MySQL
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId: !Ref ApplicationSecurityGroup
  DatabaseSubnets:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private MySQL subnets without internet route
      SubnetIds: [!Ref PrivateDbA, !Ref PrivateDbB]
  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub '${Project}-mysql'
      Engine: mysql
      DBInstanceClass: !Ref DatabaseInstanceClass
      AllocatedStorage: '20'
      MaxAllocatedStorage: 50
      StorageType: gp3
      StorageEncrypted: true
      DBName: mowoo
      MasterUsername: mowoo_admin
      ManageMasterUserPassword: true
      DBSubnetGroupName: !Ref DatabaseSubnets
      VPCSecurityGroups: [!Ref DatabaseSecurityGroup]
      PubliclyAccessible: false
      MultiAZ: false
      BackupRetentionPeriod: 1
      DeletionProtection: true
      CopyTagsToSnapshot: true
      AutoMinorVersionUpgrade: true
      Tags: [{Key: Project, Value: !Ref Project}]
Outputs:
  VpcId: {Value: !Ref Vpc}
  PublicSubnets: {Value: !Join [',', [!Ref PublicA, !Ref PublicB]]}
  ApplicationSecurityGroupId: {Value: !Ref ApplicationSecurityGroup}
  DatabaseEndpoint: {Value: !GetAtt Database.Endpoint.Address}
  DatabaseAdminSecretArn: {Value: !GetAtt Database.MasterUserSecret.SecretArn}
